<style>

.list{margin:0;padding-left:18px;font-size:14px}.list li{margin:4px 0}

.ngroup{margin-bottom:6px}

.ex-t{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 4px}.ex-t th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 6px 4px 0;border-bottom:1px solid var(--line)}.ex-t td{padding:7px 6px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}.ex-t th:not(:first-child),.ex-t td.num{text-align:right;white-space:nowrap}.ex-t .ss{display:inline-block;font-size:11px;font-weight:700;background:var(--soft);border-radius:4px;padding:0 5px;margin-right:6px;color:var(--accent)}
.wed{margin:4px 0 10px}.ex-ed input{width:100%;padding:6px 6px;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:6px}.ex-ed input.s{width:38px;text-align:right}.ex-ed input.r{width:66px;text-align:right}.ex-ed input.k{width:78px;text-align:right}.ex-ed td{padding:4px 4px 4px 0}.ex-ed th:last-child,.ex-ed td:last-child{width:24px}
.done-a{display:flex;gap:10px;align-items:center;white-space:nowrap}.done-ed{background:var(--soft);border-radius:10px;padding:4px 8px;margin:4px -8px}
.add-unit{margin-top:10px}.add-unit .chips{margin-top:6px}
.gap-tags{display:flex;flex-wrap:wrap;gap:6px}.gtag{font-size:12.5px;padding:3px 8px;border-radius:10px;background:#fbe5e5;color:var(--bad)}.gtag.done{background:#e6f4ec;color:var(--good)}
.combo-sum{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0 2px;border-top:1px solid var(--line)}.small-btn{padding:7px 12px;font-size:14px;flex:0 0 auto}
.ring-wrap{display:flex;gap:16px;align-items:center}.ring{width:128px;height:128px;flex:0 0 auto}.ring-v{font-size:24px;font-weight:700;fill:var(--ink)}.ring-l{font-size:11px;fill:var(--muted)}

.cap{min-height:1.4em;margin-top:2px}

.fc-row{border-top:1px solid var(--line);padding:10px 0}

</head>
